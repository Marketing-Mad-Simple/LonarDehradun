<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Lonar Group — 360° Virtual Tour</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
</head>

<body>
  <main id="app">

    <!-- PROPERTY / VARIANT SELECTION -->
    <section id="property-screen" class="selection-screen">
      <div class="selection-brand">
        <img src="./assets/lonar-group.png" alt="Lonar Group" onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='block';">
        <div id="brand-fallback" class="brand-fallback">LONAR GROUP</div>
        <div class="selection-eyebrow">360° PROPERTY TOUR</div>
      </div>

      <div class="selection-content">
        <p class="selection-kicker">Explore our properties</p>
        <h1>Select a property</h1>
        <p class="selection-copy">Choose a property size to continue.</p>

        <div id="property-grid" class="property-grid"></div>
      </div>
    </section>

    <section id="variant-screen" class="selection-screen hidden">
      <button id="back-to-properties" class="text-button">← Back to properties</button>

      <div class="selection-brand compact">
        <img src="./assets/lonar-group.png" alt="Lonar Group" onerror="this.style.display='none';">
        <div class="selection-eyebrow">360° PROPERTY TOUR</div>
      </div>

      <div class="selection-content">
        <p class="selection-kicker" id="variant-property-label">Property</p>
        <h1>Choose a variant</h1>
        <p class="selection-copy">Select the version you'd like to explore.</p>
        <div id="variant-grid" class="variant-grid"></div>
      </div>
    </section>

    <!-- VIEWER -->
    <section id="viewer-screen" class="hidden">
      <div id="viewer-wrap">
        <div id="pano-a" class="pano-layer"></div>
        <div id="pano-b" class="pano-layer hidden-pano"></div>

        <div id="load-overlay">
          <div class="load-ring"></div>
          <div id="load-wordmark">Lonar Group</div>
        </div>
      </div>

      <div id="arrow-layer"></div>

      <header id="top-bar">
        <div class="logo-block">
          <img id="viewer-logo" src="./assets/lonar-group.png" alt="Lonar Group">
          <div class="logo-fallback-small">LONAR GROUP</div>
          <div class="logo-eyebrow">360° Virtual Tour</div>
          <div id="property-title" class="logo-name">Property</div>
          <div id="property-variant" class="logo-sub">Variant</div>
        </div>

        <div class="top-actions">
          <div id="quality-badge">25%</div>
          <button id="change-property" class="header-button" type="button">Change Property</button>
        </div>
      </header>

      <div id="scene-pill">
        <div class="scene-pill-group" id="scene-group-display">Exterior</div>
        <div class="scene-pill-name" id="scene-name-display">Scene</div>
      </div>

      <div id="bottom-ui">
        <div id="scene-nav" role="list" aria-label="Scenes"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
